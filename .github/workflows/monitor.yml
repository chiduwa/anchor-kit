name: Anchor monitor

# Daily: GitHub delivers daily schedules reliably (sub-daily ones it often drops).
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # dist/ is committed and the core has no dependencies, so no install step.
      - name: Check balances and freshness
        run: node scripts/monitor.mjs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ vars.ALERT_TO }}
